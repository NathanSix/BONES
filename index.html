o it.","go":"","link":""},{"kind":"card","label":"1985","title":"Contact","body":"A novel about first contact and what counts as proof.","go":"","link":""},{"kind":"card","label":"1997","title":"Billions and Billions","body":"His final essays.","go":"","link":""}]},{"id":"l4","type":"cards","title":"Podcasts","sub":"","items":[{"kind":"placeholder","label":"","title":"Podcast","body":"Name, one line on why, link","go":"","link":""},{"kind":"placeholder","label":"","title":"Podcast","body":"Name, one line on why, link","go":"","link":""},{"kind":"placeholder","label":"","title":"Podcast","body":"Name, one line on why, link","go":"","link":""}]}]},{"id":"tools","group":"tools","parent":null,"layout":"standard","title":"Daily target","nav":true,"navLabel":"Tools","phase":"1","headline":"Your daily target.","lede":"Answer five questions. Get a calorie target and a simple protein, fat and carb split, then find meals that fit.","blocks":[{"id":"c1","type":"calc","fine":"Estimate from the Mifflin-St Jeor equation. Protein set at 1.6 g per kg of body weight, fat at 27% of calories, carbs fill the rest. A starting point, not medical advice. Recipe matching is still being built."},{"id":"c2","type":"note","text":"Formula and splits are draft choices. Each needs a tier tag and a source before launch."},{"id":"c3","type":"bmi","anchor":"bmi","title":"The BMI problem","sub":"A myth-bust you can run on yourself.","body":"BMI divides weight by height squared. It can't tell muscle from fat, says nothing about where fat sits, and was built from 19th-century European averages. A muscular lifter can score overweight while being very healthy.","after":"Waist-to-height is a better quick screen for the kind of fat that raises health risk. A common rule of thumb: keep your waist under half your height.","claim":{"text":"Waist-to-height ratio screens for health risk better than BMI.","tier":"2","design":"Meta-analyses","ctype":"MEASURE","why":"Pooled studies find waist-to-height tracks heart and metabolic risk at least as well as BMI, and better in several. It also captures where fat sits.","sources":"To source and verify before launch.","reviewed":"Not yet"}}]},{"id":"myths","group":"tools","parent":null,"layout":"standard","title":"Myth or truth?","nav":false,"phase":"1","headline":"Myth or truth?","lede":"Make your call before you look. Being wrong is the point; that's how it sticks.","blocks":[{"id":"y1","type":"myths","items":[{"s":"BMI tells you whether your weight is healthy.","a":"Myth","t":"2","e":"BMI cannot see muscle or where fat sits. Plenty of strong people score overweight. Waist-to-height is a better quick check."},{"s":"To get real benefit from lifting, you need to train for hours a week.","a":"Myth","t":"3","e":"Studies of large groups find the lowest risk around 30 to 60 minutes a week of strength work. Past that, gains level off."},{"s":"Eating fat makes you fat.","a":"Myth","t":"1","e":"Weight change follows total energy in and out. Fat is calorie-dense, but some fats are essential, and cutting all of it backfires."},{"s":"Bones get stronger when you load them.","a":"Truth","t":"1","e":"Bone is living tissue that remodels to the stress it gets. Weight-bearing work is one of the few things shown to build it."}]}]},{"id":"playlists","group":"tools","parent":null,"layout":"standard","title":"Playlists","nav":false,"phase":"3","headline":"Music for the work.","lede":"Each list is matched to a session, so the tempo does some of the coaching.","blocks":[{"id":"p1","type":"cards","title":"","sub":"","items":[{"kind":"placeholder","label":"","title":"Sprint","body":"High tempo, 160+ BPM. Short and loud.","go":"","link":""},{"kind":"placeholder","label":"","title":"Lift","body":"Steady and heavy, around 120 to 140 BPM.","go":"","link":""},{"kind":"placeholder","label":"","title":"Walk","body":"An easy hour for the step count.","go":"","link":""},{"kind":"placeholder","label":"","title":"Recover","body":"Slow, low, wind-down.","go":"","link":""}]},{"id":"p2","type":"note","text":"Spotify is connected, so these can be generated for real. Each slot becomes a cover, a title and an Open in Spotify button."}]},{"id":"about","group":"about","parent":null,"layout":"standard","title":"What this is","nav":false,"phase":"","headline":"Free, and meant to stay that way.","lede":"","blocks":[{"id":"b1","type":"para","text":"BONES takes information that is already public and does the work of structuring it, so anyone can understand their body and the world without a subscription, a supplement sale, or a guru."},{"id":"b2","type":"para","text":"It sticks to the science. Where the science leads is for you to decide."},{"id":"b3","type":"cards","title":"","sub":"","items":[{"kind":"card","label":"","title":"How we grade claims","body":"","go":"Read","link":"check"},{"kind":"card","label":"","title":"For Carl Sagan","body":"","go":"Read","link":"sagan"},{"kind":"card","label":"","title":"Wear the mark","body":"","go":"See","link":"wear"}]}]},{"id":"check","group":"about","parent":null,"layout":"standard","title":"How we grade","nav":false,"phase":"","headline":"How we grade claims.","lede":"We grade each claim, not each article. One page can hold a rock-solid fact and an open question, and you should be able to tell them apart.","blocks":[{"id":"k1","type":"tiers"},{"id":"k2","type":"note","text":"This is the current provisional scale. The redesign (study design and evidence quality as two separate columns) is still open item #1, so tags carry design and claim type separately until it's settled."},{"id":"k3","type":"heading","title":"Why trust this?","sub":""},{"id":"k4","type":"para","text":"BONES is made by a curious non-expert, not a scientist or a nutritionist. So it doesn't ask for your trust on credentials. It shows its work: every claim graded, every source linked, every page stamped with when it was last checked."},{"id":"k5","type":"para","text":"This is education, not medical advice. For anything about your own health, talk to a clinician."}]},{"id":"sagan","group":"about","parent":null,"layout":"standard","title":"For Carl Sagan","nav":false,"phase":"","headline":"For Carl Sagan.","lede":"","blocks":[{"id":"g1","type":"para","text":"Carl Sagan, 1934 to 1996, spent his life explaining the universe to people who had never been told they could understand it."},{"id":"g2","type":"para","text":"This project began with his books. They showed that wonder and rigor are not opposites, and that the person reading deserves both. BONES tries to carry that forward: say what's true, show how we know, and trust you to take it from there."},{"id":"g3","type":"note","text":"Draft. Rewrite in your own words."},{"id":"g4","type":"slot","tall":false,"title":"Portrait or Pale Blue Dot image","body":"Check image rights before use"}]},{"id":"wear","group":"about","parent":null,"layout":"standard","title":"Wear the mark","nav":false,"phase":"3","headline":"Wear the mark.","lede":"The BONES lattice on clothes from a maker that pays fairly and builds things to last. Every shirt is a conversation that points back to a free library.","blocks":[{"id":"w1","type":"cards","title":"","sub":"","items":[{"kind":"placeholder","label":"","title":"Product","body":"Photo, name, maker, price, link","go":"","link":""},{"kind":"placeholder","label":"","title":"Product","body":"Photo, name, maker, price, link","go":"","link":""},{"kind":"placeholder","label":"","title":"About the maker","body":"Who they are and why we picked them","go":"","link":""}]},{"id":"w2","type":"note","text":"Partner not chosen. The name can't be trademarked, so the mark carries the brand."}]}],"langs":[{"code":"en","name":"English","dir":"ltr"}],"ui":{},"i18n":{}}</script>

const EXAMPLE_BLOCKS = [{"id": "article-1", "type": "layers", "title": "The short version", "sub": "Read this first. Open the evidence when you want the detail.", "items": [{"tag": "01 / Lift", "title": "Short and heavy", "body": "Two sessions of about 30 minutes a week cover most of what the research links to lower risk."}, {"tag": "02 / Walk", "title": "Most days", "body": "The benefit builds fastest in the first few thousand steps, then levels off."}, {"tag": "03 / Check", "title": "Read numbers in context", "body": "These figures describe patterns across groups. They cannot tell you exactly what will happen to you."}]}, {"id": "article-2", "type": "heading", "title": "The idea", "sub": "You're not overloaded. You're under-built.", "anchor": "idea"}, {"id": "article-3", "type": "para", "text": "Modern life asks very little of the body, and bone, muscle and tendon adapt to what they are asked to do. The answer is not to go back to living like early humans. It is to give the modern body a small, regular dose of load."}, {"id": "article-4", "type": "para", "text": "So how little is enough? There is no single minimum for every person and goal. But large studies keep finding the same shape: going from nothing to a little brings the biggest drop in risk, and each extra hour after that buys less."}, {"id": "article-5", "type": "heading", "title": "What the evidence says", "sub": "An association is a useful clue, not a personal forecast", "anchor": "evidence"}, {"id": "article-20", "type": "claim", "text": "A 2022 review of cohort studies found that about 30 to 60 minutes a week of muscle-strengthening activity was associated with the lowest risk of death from all causes, heart disease and cancer. Beyond that, the curve flattened.", "tier": "3", "design": "Systematic review and meta-analysis of cohort studies", "ctype": "ASSOC", "why": "The relationship was J-shaped: benefit rose quickly, peaked, then leveled off. People were not randomly assigned to lift, and activity was mostly self-reported, so this shows a link rather than proof of cause. That keeps it at T3.", "sources": "Momma H, et al. (2022). Muscle-strengthening activities are associated with lower risk and mortality in major non-communicable diseases: a systematic review and meta-analysis of cohort studies. British Journal of Sports Medicine 56(13):755.\nhttps://bjsm.bmj.com/content/56/13/755", "reviewed": "Source checked 11 Oct 2026 · Grade proposed by BONES"}, {"id": "article-21", "type": "claim", "text": "Bone is living tissue that adapts to the load placed on it. Regular, sufficient loading signals it to remodel and strengthen.", "tier": "1", "design": "Lab, animal and human studies across many decades", "ctype": "EFFECT", "why": "This is one of the most consistently replicated principles in bone biology, shown by independent research groups using different methods. It is the BONES thesis in one line.", "sources": "Long-established principle of bone adaptation (the mechanostat). Review citation to be added before launch.", "reviewed": "Review source pending · Grade proposed by BONES"}, {"id": "article-22", "type": "claim", "text": "In an 8-month randomized trial, women after menopause with low bone mass did 30 minutes of supervised heavy lifting and impact work twice a week. Their spine and hip bone density improved compared with a low-intensity home program.", "tier": "2", "design": "Randomized controlled trial", "ctype": "EFFECT", "why": "Random assignment means this can show cause and effect. It is still one trial in one group of about 100 women, with supervised training, which keeps it at T2 rather than T1.", "sources": "Watson SL, et al. (2018). High-intensity resistance and impact training improves bone mineral density and physical function in postmenopausal women with osteopenia and osteoporosis: the LIFTMOR randomized controlled trial. Journal of Bone and Mineral Research 33(2):211–220.\nhttps://academic.oup.com/jbmr/article/33/2/211/7605709", "reviewed": "Source checked 11 Oct 2026 · Grade proposed by BONES"}, {"id": "article-23", "type": "para", "text": "That trial is the clearest picture of the BONES idea: short, heavy, well-coached work changed bone in the people who most needed it. It is not a reason to start heavy and unsupervised."}, {"id": "article-6", "type": "claim", "text": "A 2025 review found that 7,000 daily steps was associated with lower mortality risk than 2,000. That does not make 7,000 a threshold everyone must cross.", "tier": "3", "design": "Systematic review and meta-analysis of cohort studies", "ctype": "ASSOC", "why": "The review pooled observational evidence. People were not randomly assigned to a lifetime step count. Health, circumstances and other habits may explain part of the association. BONES proposes T3 because the claim describes an association, even though the review rated the certainty for mortality as moderate. These two grading systems are different.", "sources": "Ding et al. (2025). Daily steps and health outcomes in adults. The Lancet Public Health.\nhttps://pubmed.ncbi.nlm.nih.gov/40713949/", "reviewed": "Source checked 11 Oct 2026 · Grade proposed by BONES"}, {"id": "article-8", "type": "claim", "text": "A 2022 analysis found that the step count where mortality associations leveled off differed by age: roughly 6,000–8,000 for adults aged 60 and over, and 8,000–10,000 for younger adults.", "tier": "3", "design": "Systematic review and meta-analysis of cohort studies", "ctype": "ASSOC", "why": "This analysis combined 15 cohorts. It illustrates why one step target cannot describe everybody. It remains observational, and the ranges are population estimates, not a prescription or a limit on useful activity.", "sources": "Paluch et al. (2022). Daily steps and all-cause mortality: a meta-analysis of 15 international cohorts. The Lancet Public Health.\nhttps://pubmed.ncbi.nlm.nih.gov/35247352/", "reviewed": "Source checked 11 Oct 2026 · Grade proposed by BONES"}, {"id": "article-7", "type": "para", "text": "Use that finding as encouragement to build activity into your day, rather than as a pass-or-fail score. A target is helpful only if it helps you choose your next action."}, {"id": "article-9", "type": "heading", "title": "What to work toward", "sub": "Guidance is separate from an observational claim", "anchor": "direction"}, {"id": "article-10", "type": "para", "text": "For adults, CDC guidance sets a weekly goal of at least 150 minutes of moderate aerobic activity, or 75 minutes of vigorous activity, plus muscle-strengthening activity on at least two days that works the major muscle groups. Smaller chunks can contribute to the total. The linked guidance below explains the alternatives."}, {"id": "article-11", "type": "para", "text": "Walking is one option, not an entry requirement. Cycling, swimming, wheeling and other accessible activities can fit an activity habit. Choose a starting point that works with your body and circumstances. If a condition or injury affects what you can do, a health professional can help adapt the plan."}, {"id": "article-12", "type": "heading", "title": "Try this week", "sub": "A planning example, not a prescribed training program", "anchor": "try"}, {"id": "article-13", "type": "steps", "items": [{"text": "Lift twice. Two sessions of about 25 to 30 minutes: squat, hinge, push, pull. Choose a weight where the last few reps are hard but your form holds."}, {"text": "Walk most days. Tie it to a cue: “After lunch, I go outside.” Build toward the 7,000 to 9,000 range rather than a heroic number."}, {"text": "Review the fit. At the end of the week, note what made it easier to repeat. Add weight or time to one thing before adding anything new."}]}, {"id": "article-24", "type": "para", "text": "If you are new to lifting, or have an injury or a condition such as osteoporosis, learn the movements with a qualified coach or physical therapist first. Heavy is relative to you."}, {"id": "article-14", "type": "para", "text": "You are testing whether a routine fits your life. A week that teaches you how to make the next week workable has done something useful, even when it does not look tidy in an app."}, {"id": "article-15", "type": "heading", "title": "Keep one idea", "sub": "A direction you can act on", "anchor": "takeaway"}, {"id": "article-16", "type": "para", "text": "Short, heavy, weight-bearing work plus regular walking captures most of the benefit. Begin with something you can repeat, then add load."}, {"id": "article-17", "type": "cards", "title": "Go deeper", "sub": "Original research and public-health guidance. Links open in a new tab.", "anchor": "sources", "items": [{"kind": "card", "label": "Review / 2022", "title": "Strength training and mortality", "body": "The J-curve behind the strength claim.", "go": "Read the study", "link": "https://bjsm.bmj.com/content/56/13/755"}, {"kind": "card", "label": "Trial / 2018", "title": "The LIFTMOR trial", "body": "Short, heavy, supervised lifting and bone density.", "go": "Read the study", "link": "https://academic.oup.com/jbmr/article/33/2/211/7605709"}, {"kind": "card", "label": "Review / 2025", "title": "Steps and health outcomes", "body": "The review behind the 7,000-step claim.", "go": "Read the study abstract", "link": "https://pubmed.ncbi.nlm.nih.gov/40713949/"}, {"kind": "card", "label": "Review / 2022", "title": "Steps, age and mortality", "body": "The age-specific analysis behind the step plateau claim.", "go": "Read the study abstract", "link": "https://pubmed.ncbi.nlm.nih.gov/35247352/"}, {"kind": "card", "label": "Guidance / CDC", "title": "Adult activity recommendations", "body": "Weekly activity goals and ways to combine activities.", "go": "Read the guidance", "link": "https://www.cdc.gov/physical-activity-basics/guidelines/adults.html"}, {"kind": "card", "label": "Guidance / WHO", "title": "Activity takes many forms", "body": "Background on activity, health and accessible ways to move.", "go": "Read the overview", "link": " const ADDABLE = ['heading', 'para', 'claim', 'steps', 'index', 'cards', 'slot', 'note', 'story', 'journey', 'myths'];

function newBlock(t) {
  const b = { id: uid(), type: t };
  const tpl = SCH[t].items && SCH[t].items.tpl;
  switch (t) {
    case 'heading': Object.assign(b, { title: 'New heading', sub: '' }); break;
    case 'para': b.text = ''; break;
    case 'claim': Object.assign(b, { text: '', tier: '3', design: '', ctype: 'ASSOC', why: '', sources: '', reviewed: 'Not yet' }); break;
    case 'steps': b.items = [tpl()]; break;
    case 'index': Object.assign(b, { title: 'In this section', sub: '', items: [tpl()] }); break;
    case 'cards': Object.assign(b, { title: '', sub: '', items: [tpl()] }); break;
    case 'slot': Object.assign(b, { title: 'Placeholder', body: 'What goes here', tall: false }); break;
    case 'note': b.text = ''; break;
    case 'story': Object.assign(b, { title: '', sub: '', items: [tpl()] }); break;
    case 'journey': b.items = [tpl()]; break;
    case 'myths': b.items = [tpl()]; break;
    default: break;
  }
  return b;
}
function tplBlocks(kind) {
  if (kind === 'example') return EXAMPLE_BLOCKS.map((b) => Object.assign(cloneBlock(b), b.anchor ? { anchor: b.anchor } : {}));
  if (kind === 'pillar') return [newBlock('index'), newBlock('slot')];
  if (kind === 'article') {
    return [Object.assign(newBlock('heading'), { title: 'Orient', sub: 'The idea' }), newBlock('para'), newBlock('claim'),
      Object.assign(newBlock('heading'), { title: 'Operate', sub: 'What to do' }), newBlock('steps')];
  }
  return [newBlock('para')];
}

function ensureShape() {
  S.pages.forEach((p) => {
    if (!Array.isArray(p.blocks)) p.blocks = [];
    p.blocks.forEach((b) => { if (!b.id) b.id = uid(); if (SCH[b.type] && SCH[b.type].items && !Array.isArray(b.items)) b.items = []; });
    if (!p.parent && HUB_GROUPS.includes(p.group) && !p.tile) p.tile = { blurb: '', items: [] };
    if (p.tile && !Array.isArray(p.tile.items)) p.tile.items = [];
  });
  if (!S.settings) S.settings = { palette: 'black', type: 'mono' };
  if (!Array.isArray(S.langs) || !S.langs.length) S.langs = [{ code: 'en', name: 'English', dir: 'ltr' }];
  if (!S.ui || typeof S.ui !== 'object') S.ui = {};
  if (!S.i18n || typeof S.i18n !== 'object') S.i18n = {};
}

/* ================= Rendering: text and item helpers ================= */
function T(tag, path, cls, ph, enter) {
  return `<${tag}${cls ? ` class="${cls}"` : ''} data-edit="${path}"${ph ? ` data-ph="${esc(ph)}"` : ''}${enter ? ` data-enter="${enter}"` : ''}>${esc(getP(path))}</${tag}>`;
}
function I(list, ii) { return ` data-ii="${ii}" data-drag="${list}" data-idx="${ii}"`; }
function ictl(list, ii, opt) {
  if (!ui.editing) return '';
  opt = opt || {};
  return `<span class="ictl"><button class="ib grip" type="button" title="Drag to reorder" aria-label="Drag to reorder">${IC.grip}</button>` +
    (opt.noDup ? '' : `<button class="ib" type="button" data-act="idup" data-list="${list}" data-i="${ii}" title="Duplicate" aria-label="Duplicate">${IC.dup}</button>`) +
    (opt.noDel ? '' : `<button class="ib" type="button" data-act="idel" data-list="${list}" data-i="${ii}" title="Delete" aria-label="Delete">${IC.del}</button>`) +
    '</span>';
}
function addItem(list, type, label) {
  if (!ui.editing) return '';
  return `<button class="add-item" type="button" data-act="additem" data-list="${list}" data-type="${type}">${esc(label)}</button>`;
}
function head(P) { return `<div class="section-head">${T('h2', P + '.title', '', 'Section title (optional)')}${T('p', P + '.sub', '', 'Subtitle (optional)')}</div>`; }
function phase(p) { return p.phase ? `<span class="phase" data-p="${esc(p.phase)}">Phase ${esc(p.phase)}</span>` : ''; }
function tierChip(t, claimRef) {
  return `<${claimRef ? 'button' : 'span'} class="tier"${claimRef ? ' type="button"' : ''} data-t="${esc(t)}"${claimRef ? ` data-claim="${claimRef}"` : ''}>T${esc(t)}${claimRef ? ' · ' + esc(tierName(t)) : ''}</${claimRef ? 'button' : 'span'}>`;
}

/* ================= Rendering: page, chrome, editor ================= */
function crumb(p) {
  const bits = [];
  if (p.group) bits.push(`<a href="#home">${esc(groupName(p.group))}</a>`);
  if (p.parent && page(p.parent)) bits.push(`<a href="#${esc(p.parent)}">${esc(page(p.parent).title)}</a>`);
  bits.push(`<span>${esc(p.title)}</span>`);
  return `<div class="crumb label">${bits.join('<span>/</span>')}</div>`;
}
function blockHtml(p, pi, b, bi) {
  const P = `pages.${pi}.blocks.${bi}`;
  const fn = R[b.type];
  const inner = fn ? fn(b, P, { p, pi, bi }) : '';
  const anchor = b.anchor ? ` id="a-${esc(b.anchor)}"` : '';
  if (!ui.editing) return `<div class="blk" data-type="${b.type}"${anchor}>${inner}</div>`;
  const sc = SCH[b.type] || { n: b.type };
  const sel = ui.sel && ui.sel.bi === bi ? ' is-sel' : '';
  const L = `pages.${pi}.blocks`;
  return `<div class="blk${sel}" data-type="${b.type}" data-bi="${bi}" data-drag="${L}" data-idx="${bi}"${anchor}>
    <div class="ins"><button type="button" data-act="ins" data-at="${bi}">+ Add block</button></div>
    <div class="btb"><button class="ib grip" type="button" title="Drag to reorder" aria-label="Drag to reorder">${IC.grip}</button><span class="bn">${esc(sc.n)}</span>
    <button class="ib" type="button" data-act="bup" data-bi="${bi}" title="Move up" aria-label="Move up">${IC.up}</button><button class="ib" type="button" data-act="bdown" data-bi="${bi}" title="Move down" aria-label="Move down">${IC.down}</button>
    <button class="ib" type="button" data-act="bdup" data-bi="${bi}" title="Duplicate" aria-label="Duplicate">${IC.dup}</button><button class="ib" type="button" data-act="bdel" data-bi="${bi}" title="Delete" aria-label="Delete">${IC.del}</button></div>
    ${inner}</div>`;
}
/* Evidence section: every graded claim on the page, so a grade chip can jump to its full
   evidence (assets/bones.js) instead of opening the drawer. The drawer still serves the editor. */
const EV_KIND = { EFFECT: 'Cause and effect', ASSOC: 'A link, not proof of cause', MEASURE: 'A measurement', THEORY: 'An explanation still being tested', STATUS: 'A documented fact or rule' };
function evidenceHtml(p) {
  if (ui.editing || !(window.BONES && window.BONES.evidence)) return '';
  const items = [];
  p.blocks.forEach((b, bi) => {
    const ref = b.type === 'claim' ? 'b:' + bi : b.type === 'bmi' && b.claim ? 'bmi:' + bi : null;
    if (!ref) return;
    const c = b.type === 'bmi' ? b.claim : b;
    const sources = String(c.sources || '').split('\n').map((x) => x.trim()).filter(Boolean).map((line) => {
      const m = line.match(/https?:\/\/[^\s<>]+/);
      const label = m ? line.replace(m[0], '').replace(/[\s·:,-]+$/, '').trim() : line;
      return [label || (m && m[0]) || line, m ? m[0] : ''];
    });
    items.push({ id: ref, t: c.tier, grade: `T${c.tier} · ${tierName(c.tier)}`, claim: c.text || L('untitled'),
      rows: [['Kind', EV_KIND[c.ctype] || c.ctype], [L('design'), c.design], [L('why'), c.why], [L('reviewed'), c.reviewed]], sources });
  });
  if (!items.length) return '';
  return window.BONES.evidence.section({ cls: 'blk', headCls: '', title: 'Every graded claim on this page', items });
}

    await Promise.all([
      animate(top, [{ transform: 'translateY(-100%)' }, { transform: 'translateY(0)' }], close),
      animate(bot, [{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }], close)
    ]);
    root.classList.remove('glitching');
    setDim(to);
    await animate(line, [{ transform: 'scaleX(0)', opacity: 1 }, { transform: 'scaleX(1)', opacity: 1, offset: 0.55 }, { transform: 'scaleX(1)', opacity: 0 }], { duration: 420, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'forwards' });
    const open = { duration: 460, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' };
    await Promise.all([
      animate(top, [{ transform: 'translateY(0)' }, { transform: 'translateY(-100%)' }], open),
      animate(bot, [{ transform: 'translateY(0)' }, { transform: 'translateY(100%)' }], open)
    ]);
  } catch (err) {
    // Canceled animations must leave the site usable and the switch unlocked.
    setDim(to);
  } finally {
    animations.forEach((animation) => animation.cancel());
    root.classList.remove('glitching');
    ov.remove(); flipping = false;
    const focused = document.activeElement;
    if (!activeModal() && (focused === document.body || (focused && focused.closest('.dim-switch')))) {
      const sw = document.querySelector('.dim-switch'); if (sw) sw.focus({ preventScroll: true });
    }
  }
}

const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
let konamiAt = 0;
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('[data-edit], input, textarea, select')) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  konamiAt = k === KONAMI[konamiAt] ? konamiAt + 1 : (k === KONAMI[0] ? 1 : 0);
  if (konamiAt === KONAMI.length) { konamiAt = 0; flipDim(); }
});

/* ================= Landing intro: the logo reveal ================= */
const REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const IT = { T_MARK: 0.15, D_MARK: 0.9, T_HOLE: 0.95, S_HOLE: 0.13, D_HOLE: 0.8, T_WORD: 2.15, D_WORD: 1.2, T_TAG: 3.35, S_TAG: 0.06 };
IT.N = LOGO.slots.length;
IT.T_TYPED = IT.T_TAG + IT.N * IT.S_TAG;
IT.T_FLY = IT.T_TYPED + 0.85;
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const prog = (t, a, d) => clamp01((t - a) / d);
const eCubic = (p) => 1 - Math.pow(1 - p, 3);
const eQuart = (p) => 1 - Math.pow(1 - p, 4);
const eBack = (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
let introState = null;

function playIntro() {
  if (REDUCE || introState) return;
  const compact = window.innerWidth < 640;
  const KW = compact ? 0.58 : 1;
  const KT = compact ? 0.82 : 1;
  const VB = compact ? '165 45 420 490' : '40 45 670 490';
  const tagX = [];
  LOGO.slots.forEach((g, k) => { if (g !== null) tagX[g] = (375 - LOGO.slotX[k]) * (1 - KT); });
  const ov = document.createElement('div');
  ov.className = 'splash' + (compact ? ' compact' : '');
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-modal', 'true');
  ov.setAttribute('aria-label', L('splash'));
  ov.innerHTML = `<div class="intro-bg"></div><div class="intro-stage">
    <svg class="intro-l intro-mark" viewBox="${VB}" aria-hidden="true"><g class="i-mark"><path class="i-fg i-outer" d="${LOGO.outer}"/>${LOGO.holes.map((h) => `<path class="i-hole" d="${h.d}" visibility="hidden"/>`).join('')}</g></svg>
    <svg class="intro-l intro-word" viewBox="${VB}" aria-hidden="true"><g class="i-word">${LOGO.letters.map((l) => `<path class="i-fg" fill-rule="evenodd" d="${l.d}" opacity="0"/>`).join('')}</g></svg>
    <svg class="intro-l intro-tag" viewBox="${VB}" aria-hidden="true">${LOGO.tag.map((d, g) => `<path class="i-fg" fill-rule="evenodd" d="${d}" opacity="0"${tagX[g] ? ` transform="translate(${tagX[g].toFixed(2)} 0)"` : ''}/>`).join('')}<rect class="i-fg i-cursor" y="499" width="11" height="19" visibility="hidden"/></svg>
  </div><button class="intro-skip" type="button">Skip intro</button>`;
  document.body.appendChild(ov);
  document.body.classList.add('intro-on', 'intro-hold');
  root.classList.add('intro-lock');
  const st = {
    ov, start: performance.now(), raf: 0, done: false,
    markG: ov.querySelector('.i-mark'), outer: ov.querySelector('.i-outer'),
    holes: Array.from(ov.querySelectorAll('.i-hole')),
    letters: Array.from(ov.querySelectorAll('.i-word path')),
    tags: Array.from(ov.querySelectorAll('.intro-tag path')),
    cursor: ov.querySelector('.i-cursor'),
    kw: KW, kt: KT
  };
  introState = st;
  app.inert = true;
  ov.querySelector('.intro-skip').focus({ preventScroll: true });
  const skip = (e) => { if (e && e.type === 'keydown' && ['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return; finishIntro(true); };
  st.skip = skip;
  ov.addEventListener('pointerdown', skip);
  window.addEventListener('keydown', skip, true);
  window.addEventListener('wheel', skip, { passive: true });
  const tick = (now) => {
    const t = (now - st.start) / 1000;
    renderIntro(st, t);
    if (t >= IT.T_FLY) finishIntro(false);
    else st.raf = requestAnimationFrame(tick);
  };
  st.raf = requestAnimationFrame(tick);
}

function renderIntro(st, t) {
  const pm = eCubic(prog(t, IT.T_MARK, IT.D_MARK));
  const sc = 0.94 + 0.06 * pm;
  st.markG.setAttribute('transform', `translate(${LOGO.mcx} ${LOGO.mcy + 8 * (1 - pm)}) scale(${sc}) translate(${-LOGO.mcx} ${-LOGO.mcy})`);
  st.markG.setAttribute('opacity', eCubic(prog(t, IT.T_MARK, 0.6)));
  LOGO.holes.forEach((h, i) => {
    const s = eBack(prog(t, IT.T_HOLE + i * IT.S_HOLE, IT.D_HOLE));
    const el = st.holes[i];
    if (s <= 0.001) { el.setAttribute('visibility', 'hidden'); return; }
    el.setAttribute('visibility', 'visible');
    el.setAttribute('transform', `translate(${h.cx} ${h.cy}) scale(${s}) translate(${-h.cx} ${-h.cy})`);
  });
  const pw = eQuart(prog(t, IT.T_WORD, IT.D_WORD));
  const lo = eCubic(prog(t, IT.T_WORD, 0.7));
  LOGO.letters.forEach((l, i) => {
    st.letters[i].setAttribute('transform', `translate(${(375 - l.cx) * (1 - st.kw * (0.1 + 0.9 * pw))} 0)`);
    st.letters[i].setAttribute('opacity', lo);
  });
  LOGO.slots.forEach((g, k) => { if (g !== null) st.tags[g].setAttribute('opacity', prog(t, IT.T_TAG + k * IT.S_TAG, 0.05)); });
  let cur = null;
  if (t >= IT.T_TAG - 0.35 && t < IT.T_TYPED) cur = t < IT.T_TAG ? 0 : Math.min(IT.N, Math.floor((t - IT.T_TAG) / IT.S_TAG) + 1);
  else if (t >= IT.T_TYPED && Math.floor((t - IT.T_TYPED) / 0.4) % 2 === 0) cur = IT.N;
  if (cur === null) st.cursor.setAttribute('visibility', 'hidden');
  else { st.cursor.setAttribute('visibility', 'visible'); st.cursor.setAttribute('x', 375 + (LOGO.slotX[cur] - 375) * st.kt - 5.5); }
}

function flipTo(layer, from, to) {
  const L = layer.getBoundingClientRect();
  const k = to.w / from.width;
  const tx = to.x - L.left - k * (from.left - L.left);
  const ty = to.y - L.top - k * (from.top - L.top);
  layer.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
}

function finishIntro(skipped) {
  const st = introState;
  if (!st || st.done) return;
  st.done = true;
  cancelAnimationFrame(st.raf);
  st.ov.removeEventListener('pointerdown', st.skip);
  window.removeEventListener('keydown', st.skip, true);
  window.removeEventListener('wheel', st.skip);
  renderIntro(st, IT.T_TYPED + 0.01);
  st.cursor.setAttribute('visibility', 'hidden');
  window.scrollTo(0, 0);
  const heroSvg = document.querySelector('.hero-mark svg');
  const word = document.querySelector('.hero .wordmark');
  const markLayer = st.ov.querySelector('.intro-mark');
  const wordLayer = st.ov.querySelector('.intro-word');
  if (skipped) st.ov.classList.add('fast');
  if (heroSvg && word && heroSvg.getBoundingClientRect().width > 0) {
    const bb = st.outer.getBBox();
    const hr = heroSvg.getBoundingClientRect();
    const s = hr.width / 278;
    flipTo(markLayer, st.outer.getBoundingClientRect(), { x: hr.left + (bb.x - 236) * s, y: hr.top + (bb.y - 57) * s, w: bb.width * s });
    const wg = st.ov.querySelector('.i-word').getBoundingClientRect();
    const range = document.createRange(); range.selectNodeContents(word);
    const wr = range.getBoundingClientRect();
    const ls = parseFloat(getComputedStyle(word).letterSpacing) || 0;
    const fs = parseFloat(getComputedStyle(word).fontSize) || 60;
    const tw = Math.max(10, wr.width - ls);
    const k = tw / wg.width;
    const capTop = wr.top + (wr.height - fs * 0.72) / 2;
    flipTo(wordLayer, wg, { x: wr.left, y: capTop, w: tw });
    void k;
  }
  st.ov.classList.add('out');
  const dur = skipped ? 520 : 950;
  setTimeout(() => {
    document.body.classList.remove('intro-on');
    document.body.classList.add('intro-reveal');
  }, skipped ? 180 : 420);
  setTimeout(() => {
    document.body.classList.remove('intro-hold');
    st.ov.remove();
    app.inert = false;
    $('main').focus({ preventScroll: true });
    root.classList.remove('intro-lock');
    introState = null;
    setTimeout(() => document.body.classList.remove('intro-reveal'), 1100);
  }, dur);
}

/* ================= Boot ================= */
function boot() {
  ensureShape();
  BASE = JSON.stringify(S);
  applyLang();
  app.innerHTML = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-mark" viewBox="236 57 278 286"><path fill="currentColor" fill-rule="evenodd" d="${MARK}"/></symbol></defs></svg>` +
    '<div id="banner"></div><header class="topbar" id="top"></header><main id="main" tabindex="-1"></main><footer id="foot"></footer><div id="layer"></div>';
  try {
    const d = JSON.parse(ls('draft') || 'null');
    if (d && d.data) {
      if (JSON.stringify(d.data) === BASE) ls('draft', null);
      else ui.banner = { at: d.at, older: d.base !== S.rev, data: d.data };
    }
  } catch (e) { ls('draft', null); }
  if (ss('saved')) { ss('saved', null); setTimeout(() => toast('Saved'), 50); }
  route();
  if (ui.page === 'home' && !(location.hash || '').replace('#', '') && !ss('resume-edit') && !ss('intro-seen') && !REDUCE) {
    ss('intro-seen', '1');
    playIntro();
  }
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then((api) => {
      if (!api) return null;
      ed.api = api;
      return window.claude.use('user').then((u) => {
        if (!u) return true;
        return Promise.all([u.can('files.write'), u.isOwner(), u.canEdit()]).then(([w, o, c]) => w !== false || o || c);
      });
    }).then((ok) => {
      if (!ok) return;
      ed.can = true;
      if (ss('resume-edit')) { ss('resume-edit', null); ui.editing = true; }
      renderAll();
    }).catch(() => { /* stay read-only */ });
  }
}
boot();
})();
</script>
