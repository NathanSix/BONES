<style>
/* Layout: one screen. The zoom fills it; a power-of-ten ruler runs down the right edge; the stop card sits low.
   Opening a topic lays a reader over it, organised as a bone cross-section: cortex, lattice, marrow. */
:root {
  --bg: #ECE9E2; --surface: #F6F4EF; --fg: #1C1B18; --muted: #69645A; --line: #D2CDC2;
  --accent: #2E4C6E; --hatch: rgba(28, 27, 24, 0.07); --scrim: rgba(20, 19, 17, 0.42);
  --t1: #2F8A57; --t2: #2E7FA0; --t3: #B07D1F; --t4: #BE5E2A; --t5: #B23B3B;
  --h-move: #A93A23; --h-fuel: #855B09; --h-recover: #3953A0; --h-science: #6741AE;
  --h-evolution: #2F7139; --h-thinking: #116C6A; --h-library: #844F2B;
  --marrow: #9E3B2C; --lattice: #8A7F6C;
  --f-display: "Bones Display", "Overpass Mono", ui-monospace, Menlo, monospace;
  --f-ui: "Overpass Mono", ui-monospace, Menlo, Consolas, monospace;
  --s-label: 0.6875rem; --s-small: 0.8125rem; --s-ui: 0.9375rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}

  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #0E0D0B; --fg: #ECE8E1; --muted: #8C867B; --line: #2A2723;
    --accent: #9DBBDD; --hatch: rgba(236, 232, 225, 0.07); --scrim: rgba(0, 0, 0, 0.6);
    --t1: #5DBB85; --t2: #5DB0CF; --t3: #D9A441; --t4: #E08350; --t5: #E06666;
    --h-move: #F2836A; --h-fuel: #E6B652; --h-recover: #93AAF5; --h-science: #B9A0F5;
    --h-evolution: #78C98E; --h-thinking: #5FCCC6; --h-library: #DDA477;
    --marrow: #E07A66; --lattice: #A89F8E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #0E0D0B; --fg: #ECE8E1; --muted: #8C867B; --line: #2A2723;
  --accent: #9DBBDD; --hatch: rgba(236, 232, 225, 0.07); --scrim: rgba(0, 0, 0, 0.6);
  --t1: #5DBB85; --t2: #5DB0CF; --t3: #D9A441; --t4: #E08350; --t5: #E06666;
  --h-move: #F2836A; --h-fuel: #E6B652; --h-recover: #93AAF5; --h-science: #B9A0F5;
  --h-evolution: #78C98E; --h-thinking: #5FCCC6; --h-library: #DDA477;
  --marrow: #E07A66; --lattice: #A89F8E;

}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

/* ---------- Zoom ---------- */
.zoom { position: relative; height: 100%; overflow: hidden; touch-action: none; }

.top { position: absolute; z-index: 3; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 64px); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.proto:hover { color: var(--fg); border-color: var(--muted); }
.hint { font-size: var(--s-label); color: var(--muted); letter-spacing: 0.04em; }

.readout { position: absolute; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px)); top: 64px; pointer-events: none; display: grid; gap: 2px; }
.readout .pow { font-family: var(--f-display); font-size: clamp(2.6rem, 9vw, 5.4rem); line-height: 0.95; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.readout .pow sup { font-size: 0.42em; vertical-align: 1.15em; letter-spacing: 0.04em; margin-left: 0.04em; }
.readout .pow small { font-size: 0.32em; letter-spacing: 0.1em; margin-left: 0.3em; }
.readout .fov { font-size: var(--s-small); color: var(--muted); }

/* Ruler */
.ruler { position: absolute; z-index: 3; top: 58px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); width: 54px; touch-action: none; cursor: ns-resize; }
.ruler .rail { position: absolute; top: 0; bottom: 0; right: 14px; width: 1px; background: var(--line); }

.ruler .now::before { content: ""; position: absolute; left: -7px; top: -4px; border: 5px solid transparent; border-left-color: var(--fg); }
.ruler .end { position: absolute; right: 0; font-size: 0.625rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }

.zctl { position: absolute; z-index: 3; right: calc(max(10px, env(safe-area-inset-right, 0px)) + 62px); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; }
.zctl button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1.15rem; line-height: 1; display: grid; place-items: center; }
.zctl button:hover { border-color: var(--fg); }

.scalebar { position: absolute; z-index: 2; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; justify-items: center; gap: 3px; pointer-events: none; }
.scalebar i { display: block; height: 7px; border: 1.5px solid var(--fg); border-top: 0; }
.scalebar span { font-size: var(--s-label); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Stop card */
.card { position: absolute; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(56px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100% - 140px)); max-height: 52%; overflow-y: auto; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; transition: opacity 0.25s ease; }
.card .eyebrow { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.card h2 { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; letter-spacing: 0.05em; font-size: 1.35rem; line-height: 1.1; }
.card p { font-size: var(--s-small); line-height: 1.65; }
.topics { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.topics a, .topics button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; width: 100%; text-align: left; text-decoration: none; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; cursor: pointer; transition: border-color 0.15s ease; }
.topics a:hover, .topics button:hover { border-color: var(--fg); }
.topics b { font-size: var(--s-small); font-weight: 600; min-width: 0; }
.topics small { grid-column: 1 / -1; font-size: var(--s-label); color: var(--muted); letter-spacing: 0.02em; line-height: 1.5; }
.st { font-size: 0.625rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.st.depth { border-color: var(--marrow); color: var(--marrow); }
.st.draft { border-style: dashed; }
.gap { font-size: var(--s-small); color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; }
.between { color: var(--muted); }
@media (max-width: 640px) {
  .card { left: max(10px, env(safe-area-inset-left, 0px)); width: calc(100% - 80px - max(10px, env(safe-area-inset-left, 0px))); max-height: 40%; padding: 14px; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); }
  .zctl { display: none; }

}

/* ---------- Reader: a bone, from the surface in ---------- */
.reader { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.reader[hidden] { display: none; }
.reader.in { animation: dive 0.5s var(--ease); }
@keyframes dive { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
.gauge { border-right: 1px solid var(--line); padding: calc(18px + env(safe-area-inset-top, 0px)) 18px 18px max(18px, env(safe-area-inset-left, 0px)); display: grid; align-content: start; gap: 18px; }
.back { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: var(--s-small); justify-self: start; }
.back:hover { border-color: var(--fg); }
.xsec { width: 100%; max-width: 180px; aspect-ratio: 1; display: block; }
.xsec .ring { cursor: pointer; transition: opacity 0.25s ease; }
.layers { display: grid; gap: 6px; }
.layers button { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 2px 10px; text-align: left; border: 1px solid transparent; background: none; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.layers button i { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; background: var(--lc); grid-row: span 2; }
.layers button b { font-size: var(--s-small); font-weight: 600; }
.layers button span { font-size: var(--s-label); color: var(--muted); }
.layers button[aria-current="true"] { border-color: var(--lc); background: color-mix(in srgb, var(--lc) 8%, var(--surface)); }
.page { position: relative; overflow-y: auto; min-width: 0; }
.layer { min-height: 100%; padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(60px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.layer[hidden] { display: none; }
.layer.rise { animation: rise 0.45s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
.col { max-width: 42rem; margin-inline: auto; display: grid; gap: 22px; }
.layer h1 { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; letter-spacing: 0.04em; font-size: clamp(1.9rem, 5vw, 3rem); line-height: 1.05; }
.layer h2 { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; letter-spacing: 0.04em; font-size: clamp(1.25rem, 3vw, 1.6rem); line-height: 1.15; }
.layer h3 { font-size: 1rem; font-weight: 600; }
.read { font-weight: 300; font-size: 1.0625rem; line-height: 1.8; }
.lede { font-weight: 300; font-size: 1.1875rem; line-height: 1.7; }
.where { display: flex; gap: 10px; align-items: center; }
.where::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--lc); }
.layer[data-l="cortex"] { --lc: var(--fg); }
.layer[data-l="lattice"] { --lc: var(--lattice); background-image: radial-gradient(color-mix(in srgb, var(--lattice) 18%, transparent) 1px, transparent 1.2px); background-size: 22px 22px; background-attachment: local; }
.layer[data-l="marrow"] { --lc: var(--marrow); background: color-mix(in srgb, var(--marrow) 7%, var(--bg)); }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.facts li { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 6px; font-size: 1rem; line-height: 1.6; }
.rule { font-family: var(--f-display); text-transform: uppercase; letter-spacing: 0.03em; font-size: clamp(1.1rem, 2.6vw, 1.45rem); line-height: 1.3; padding: 16px 0 16px 18px; border-left: 3px solid var(--h-move); }
.deeper { display: inline-flex; align-items: center; gap: 10px; justify-self: start; border: 1px solid var(--lc-next, var(--fg)); background: var(--surface); border-radius: 999px; padding: 10px 18px; cursor: pointer; font-weight: 600; font-size: var(--s-small); letter-spacing: 0.06em; text-transform: uppercase; }
.deeper:hover { background: color-mix(in srgb, var(--lc-next, var(--fg)) 10%, var(--surface)); }
.deeper svg { width: 14px; height: 14px; }
.note { font-size: var(--s-small); color: var(--muted); line-height: 1.7; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; }
.note b { color: var(--fg); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; position: relative; }
.steps::before { content: ""; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }

.vs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.vs > div { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); display: grid; gap: 6px; align-content: start; }

.tier { display: inline-flex; align-items: center; gap: 6px; vertical-align: 2px; font: inherit; font-size: 0.6875rem; line-height: 1.7; letter-spacing: 0.04em; font-weight: 500; border: 1px solid color-mix(in srgb, var(--tc, var(--muted)) 45%, var(--line)); border-radius: 999px; padding: 0 9px; background: color-mix(in srgb, var(--tc, var(--muted)) 10%, var(--surface)); white-space: nowrap; }
button.tier { cursor: pointer; }

.tier::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tc, var(--muted)); }
.tier[data-t="1"] { --tc: var(--t1); } .tier[data-t="2"] { --tc: var(--t2); } .tier[data-t="3"] { --tc: var(--t3); } .tier[data-t="4"] { --tc: var(--t4); } .tier[data-t="5"] { --tc: var(--t5); }

  .gauge { border-right: 0; border-bottom: 1px solid var(--line); grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px 14px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  .gauge .back { grid-column: 1 / -1; }
  .xsec { width: 64px; }
  .layers { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  .layers button { grid-template-columns: 1fr; justify-items: start; padding: 6px 8px; }
  .layers button i { grid-row: auto; margin: 0; }

}

  var steps = [
    ['About 2.3 to 1.2 million years ago', 'The biggest jaws: Paranthropus', 'A side branch of the human family, nicknamed “Nutcracker Man,” had huge molars, a thick jaw and a bony ridge on top of the skull for giant chewing muscles. The nickname turned out to be wrong. Chemical traces in their teeth point to tough grasses and sedges, ground down slowly, not cracked nuts.', ['paran']],
